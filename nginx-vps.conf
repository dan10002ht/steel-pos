# ============================================
# PERFORMANCE OPTIMIZATIONS (Add at top of main nginx.conf)
# Note: These settings should be in /etc/nginx/nginx.conf
# ============================================

# Worker processes = number of CPU cores
# For 1 vCPU: use 1
# For 2 vCPU: use 2
# worker_processes auto;  # Uncomment in main nginx.conf

# Maximum number of connections per worker
# events {
#     worker_connections 1024;
#     use epoll;  # Linux optimization
# }

# HTTP block optimizations
# http {
#     # Enable sendfile for better performance
#     sendfile on;
#     tcp_nopush on;
#     tcp_nodelay on;
#
#     # Keepalive timeout
#     keepalive_timeout 65;
#     keepalive_requests 100;
#
#     # Client timeouts
#     client_body_timeout 12;
#     client_header_timeout 12;
#     send_timeout 10;
#
#     # Buffer sizes
#     client_body_buffer_size 16K;
#     client_header_buffer_size 1k;
#     client_max_body_size 10m;
#     large_client_header_buffers 4 8k;
# }

# WebSocket upgrade map (must be outside server blocks)
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# HTTP to HTTPS redirect
server {
    listen 80;
    server_name cuahangkienphuoc.site www.cuahangkienphuoc.site;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS server
server {
    listen 443 ssl http2;
    server_name cuahangkienphuoc.site www.cuahangkienphuoc.site;

    # SSL configuration
    ssl_certificate /etc/letsencrypt/live/cuahangkienphuoc.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cuahangkienphuoc.site/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    
    # Resolver for DNS (critical - prevents 20s timeout)
    # Use localhost resolver or 127.0.0.1 (systemd-resolved)
    resolver 127.0.0.1 valid=10s;
    resolver_timeout 2s;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Cache index.html (Cloudflare will serve, SPA handles updates)
    location = /index.html {
        # Direct IP connection - no DNS lookup needed
        proxy_pass http://127.0.0.1:8082;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Reasonable timeout for HTML
        proxy_connect_timeout 3s;
        proxy_send_timeout 5s;
        proxy_read_timeout 5s;

        # Enable buffering
        proxy_buffering on;

        # Keepalive
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Cache for 1 hour
        add_header Cache-Control "public, max-age=3600" always;
    }

    # Frontend (React app) - Port 8082
    location / {
        # Direct IP connection - no DNS lookup needed
        proxy_pass http://127.0.0.1:8082;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Reasonable timeout
        proxy_connect_timeout 3s;
        proxy_send_timeout 5s;
        proxy_read_timeout 5s;

        # Enable buffering for better performance
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;

        # Keepalive connections to backend
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Let Cloudflare cache HTML (SPA will handle updates)
        # Cache for 1 hour, allow Cloudflare to cache
        add_header Cache-Control "public, max-age=3600" always;
    }

    # Backend API - Port 8083
    location /api/ {
        # Direct IP connection - no DNS lookup needed
        proxy_pass http://127.0.0.1:8083;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Reasonable timeouts for API - allow time for database queries
        proxy_connect_timeout 3s;       # Connection timeout
        proxy_send_timeout 10s;         # Send timeout (allow larger requests)
        proxy_read_timeout 10s;         # Read timeout (allow slower queries)
        
        # Disable buffering for API to reduce latency
        proxy_buffering off;
        
        # Keepalive connections to backend
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        
        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        
        # Don't cache API responses
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # Static assets caching (JS, CSS, images, fonts)
    # These have hash in filename from Vite, so safe to cache long-term
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp|avif)$ {
        # Direct IP connection - no DNS lookup needed
        proxy_pass http://127.0.0.1:8082;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Reasonable timeout for static assets
        proxy_connect_timeout 3s;
        proxy_send_timeout 5s;
        proxy_read_timeout 5s;
        
        # Keepalive for static assets
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        
        # Cache static assets for 1 year
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Max upload size
    client_max_body_size 10M;
}

