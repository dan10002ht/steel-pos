# WebSocket upgrade map (must be outside server blocks)
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# HTTP to HTTPS redirect
server {
    listen 80;
    server_name cuahangkienphuoc.site www.cuahangkienphuoc.site;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS server
server {
    listen 443 ssl http2;
    server_name cuahangkienphuoc.site www.cuahangkienphuoc.site;

    # SSL configuration
    ssl_certificate /etc/letsencrypt/live/cuahangkienphuoc.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cuahangkienphuoc.site/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    
    # Resolver for DNS (critical - prevents 20s timeout)
    # Use localhost resolver or 127.0.0.1 (systemd-resolved)
    resolver 127.0.0.1 valid=10s;
    resolver_timeout 2s;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Don't cache index.html - always serve fresh version
    location = /index.html {
        # Direct IP connection - no DNS lookup needed
        proxy_pass http://127.0.0.1:8082;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Reasonable timeout for HTML
        proxy_connect_timeout 3s;
        proxy_send_timeout 5s;
        proxy_read_timeout 5s;
        proxy_buffering off;
        
        # Keepalive
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        
        # Don't cache index.html
        proxy_cache_bypass $http_upgrade;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # Frontend (React app) - Port 8082
    # Don't cache HTML responses
    location / {
        # Direct IP connection - no DNS lookup needed
        proxy_pass http://127.0.0.1:8082;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Reasonable timeout - prevent 20s delay but allow normal response time
        proxy_connect_timeout 3s;        # Connection timeout
        proxy_send_timeout 5s;           # Send timeout
        proxy_read_timeout 5s;           # Read timeout
        
        # Disable buffering for HTML to reduce latency
        proxy_buffering off;
        
        # Keepalive connections to backend
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        
        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        
        # Don't cache HTML responses
        proxy_cache_bypass $http_upgrade;
        proxy_no_cache $http_upgrade;
        
        # Override cache headers from backend for HTML
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # Backend API - Port 8083
    location /api/ {
        # Direct IP connection - no DNS lookup needed
        proxy_pass http://127.0.0.1:8083;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Reasonable timeouts for API - allow time for database queries
        proxy_connect_timeout 3s;       # Connection timeout
        proxy_send_timeout 10s;         # Send timeout (allow larger requests)
        proxy_read_timeout 10s;         # Read timeout (allow slower queries)
        
        # Disable buffering for API to reduce latency
        proxy_buffering off;
        
        # Keepalive connections to backend
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        
        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        
        # Don't cache API responses
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # Static assets caching (JS, CSS, images, fonts)
    # These have hash in filename from Vite, so safe to cache long-term
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp|avif)$ {
        # Direct IP connection - no DNS lookup needed
        proxy_pass http://127.0.0.1:8082;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Reasonable timeout for static assets
        proxy_connect_timeout 3s;
        proxy_send_timeout 5s;
        proxy_read_timeout 5s;
        
        # Keepalive for static assets
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        
        # Cache static assets for 1 year
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Max upload size
    client_max_body_size 10M;
}

